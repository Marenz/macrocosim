[package]
name = "macrocosim"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
default-run = "macrocosim"

[features]
# Gates the dev-only `macrocosim-etags` binary out of default builds (and
# the distribution wheel). The emacs tags workflow enables it explicitly
# (see .dir-locals.el).
etags = []

[dependencies]
tonic-prost = "0.14"
tonic = "0.14.0"
prost = "0.14.0"
prost-types = "0.14.0"
tokio = { version = "1.43.1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = "0.1.15"
tulisp = { version = "0.29", features = ["sync", "etags"] }
tulisp-fmt = "0.1"
tulisp-async = "0.1"
notify = "6.1.1"
futures = "0.3.30"
# DAG validation + formula generation for the Dashboard's aggregated
# tiles. Macrocosim implements Node + Edge on its own component /
# connection types in src/sim/graph_adapter.rs and runs the validator
# at the end of each config-load / reload.
frequenz-microgrid-component-graph = "0.6.2"
# High-level Microgrid client + typed metric streams. The UI runs
# this as a client of each microgrid's Microgrid service over an
# in-memory channel (src/runtime.rs, supervised by
# src/ui/loopback.rs): aggregated Dashboard tiles read from the same
# LogicalMeterHandle::xxx<M>().subscribe() streams a production
# downstream control app would consume.
frequenz-microgrid = "0.7.1"
log = "0.4.22"
simplelog = "0.12.2"
rand = { version = "0.8.5", features = ["small_rng"] }
chrono = { version = "0.4.42", features = ["serde"] }
# IANA timezone resolution for (set-timezone "Europe/Berlin"). The
# UI's TZ toggle reads the configured zone name + formats client-
# side via Intl.DateTimeFormat — macrocosim just owns the name +
# rejects unknown zones at config-load time.
chrono-tz = "0.10"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
# macroctl talks to the UI server's HTTP surface for scenario commands —
# the scenario lifecycle isn't on gRPC.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# In-memory gRPC channel for the UI's loopback client (`runtime.rs`);
# tower's `util` also serves the axum oneshot tests.
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[build-dependencies]
tonic-prost-build = { version = "0.14", features = ["cleanup-markdown"] }

[dev-dependencies]
# Out-of-process integration tests in tests/ talk to the live
# HTTP / gRPC surface; reqwest is already a regular dep for macroctl,
# we just need a temp dir for per-test config files.
tempfile = "3"

[lib]
name = "macrocosim"
path = "src/lib.rs"

[[bin]]
name = "macrocosim"
path = "src/bin/macrocosim.rs"

[[bin]]
name = "macroctl"
path = "src/bin/macroctl.rs"

[[bin]]
name = "macrocosim-etags"
path = "src/bin/macrocosim-etags.rs"
required-features = ["etags"]
